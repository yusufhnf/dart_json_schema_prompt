name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
      custom_version:
        description: 'Custom version (optional, overrides version_type)'
        required: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: 📚 Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: 🎯 Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
        
    - name: 📦 Install dependencies
      run: dart pub get
      
    - name: 🧪 Run tests
      run: dart test
      
    - name: 🔢 Get current version
      id: current_version
      run: |
        CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        
    - name: 🆕 Calculate new version
      id: new_version
      run: |
        if [ -n "${{ github.event.inputs.custom_version }}" ]; then
          NEW_VERSION="${{ github.event.inputs.custom_version }}"
        else
          CURRENT="${{ steps.current_version.outputs.version }}"
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          case "${{ github.event.inputs.version_type }}" in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        fi
        
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        
    - name: 📝 Update version in pubspec.yaml
      run: |
        sed -i "s/^version:.*/version: ${{ steps.new_version.outputs.version }}/" pubspec.yaml
        
    - name: 📝 Update CHANGELOG.md
      run: |
        TODAY=$(date +%Y-%m-%d)
        sed -i "1i\\## [${{ steps.new_version.outputs.version }}] - $TODAY\n\n### Added\n- Version bump to ${{ steps.new_version.outputs.version }}\n" CHANGELOG.md
        
    - name: 💾 Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pubspec.yaml CHANGELOG.md
        git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }}"
        git push
        
    - name: 🏷️ Create and push tag
      run: |
        git tag "v${{ steps.new_version.outputs.version }}"
        git push origin "v${{ steps.new_version.outputs.version }}"
        
    - name: 📦 Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.new_version.outputs.version }}
        release_name: Release v${{ steps.new_version.outputs.version }}
        body: |
          ## Changes in v${{ steps.new_version.outputs.version }}
          
          Automated release created from version bump workflow.
          
          ### Installation
          ```yaml
          dependencies:
            dart_json_schema_prompt: ^${{ steps.new_version.outputs.version }}
          ```
          
          See [CHANGELOG.md](https://github.com/yusufhnf/dart_json_schema_prompt/blob/main/CHANGELOG.md) for detailed changes.
        draft: false
        prerelease: false